<div class="video-wrapper">
  <iframe
    [src]="'https://www.youtube.com/embed/' + youtube_id + '?rel=0&modestbranding=1' | safeUrl"
    frameborder="10"
    allowfullscreen
  >
  </iframe>
  <div class="cancel-container">
    <button class="cancel-button" (click)="goBack()">Back</button>
  </div>
</div>
